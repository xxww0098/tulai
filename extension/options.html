<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>tulai 页面桥</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F6F8FA;
      --card: #FFFFFF;
      --sunken: #F0F3F7;
      --border: #E1E6EF;
      --border-strong: #CBD4E1;
      --text: #0F172A;
      --muted: #5B677A;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --on-accent: #FFFFFF;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --focus-ring: rgba(37, 99, 235, 0.24);
      --success: #15803D;
      --success-bg: rgba(21, 128, 61, 0.08);
      --success-border: rgba(21, 128, 61, 0.25);
      --warning: #B45309;
      --warning-bg: rgba(180, 83, 9, 0.08);
      --warning-border: rgba(180, 83, 9, 0.25);
      --danger: #DC2626;
      --danger-bg: rgba(220, 38, 38, 0.08);
      --danger-border: rgba(220, 38, 38, 0.25);
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0E14;
        --card: #141923;
        --sunken: #1B2230;
        --border: #252F42;
        --border-strong: #34425A;
        --text: #F1F5F9;
        --muted: #94A3B8;
        --accent: #60A5FA;
        --accent-hover: #3B82F6;
        --on-accent: #090D16;
        --accent-soft: rgba(96, 165, 250, 0.14);
        --focus-ring: rgba(96, 165, 250, 0.28);
        --success: #34D399;
        --success-bg: rgba(52, 211, 153, 0.12);
        --success-border: rgba(52, 211, 153, 0.28);
        --warning: #FBBF24;
        --warning-bg: rgba(251, 191, 36, 0.12);
        --warning-border: rgba(251, 191, 36, 0.28);
        --danger: #F87171;
        --danger-bg: rgba(248, 113, 113, 0.12);
        --danger-border: rgba(248, 113, 113, 0.28);
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }

    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
      margin: 0;
      padding: 36px 20px;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .head-icon {
      width: 34px;
      height: 34px;
      margin-top: 2px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.015em;
      margin: 0 0 4px;
      color: var(--text);
    }

    .lead {
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
    }

    #status {
      white-space: pre-wrap;
      margin: 0;
      padding: 11px 14px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    #status:not([data-state]):empty {
      display: none;
    }

    #status[data-state="on"] {
      background: var(--success-bg);
      border-color: var(--success-border);
    }

    #status[data-state="error"] {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    #status[data-state="off"] {
      background: var(--warning-bg);
      border-color: var(--warning-border);
    }

    #status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--muted);
      vertical-align: 1px;
    }

    #status[data-state="on"]::before { background: var(--success); }
    #status[data-state="off"]::before { background: var(--warning); }
    #status[data-state="error"]::before { background: var(--danger); }
    #status:not([data-state])::before { display: none; }

    #form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      height: 36px;
      padding: 0 11px;
      font: inherit;
      font-size: 13.5px;
      color: var(--text);
      background: var(--sunken);
      border: 1px solid var(--border);
      border-radius: 6px;
      caret-color: var(--accent);
      transition: border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
    }

    input:hover {
      border-color: var(--border-strong);
    }

    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 0;
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    #token,
    #port {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 2px;
    }

    button {
      height: 34px;
      padding: 0 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, opacity 150ms ease;
    }

    button:hover {
      background: var(--sunken);
    }

    button[type="submit"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <span class="head-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </span>
      <div>
        <h1>tulai 页面桥</h1>
        <p class="lead">同一份扩展会分别向千问和豆包各发一次 hello。tulai 打开后会自动写入令牌和端口。保存后服务工作者会重新连接；手动保存会停用自动对接，直到点「恢复自动对接」。</p>
      </div>
    </header>
    <div id="status" role="status" aria-live="polite"></div>
    <form id="form">
      <div class="field">
        <label for="token">令牌</label>
        <input id="token" autocomplete="off" spellcheck="false" placeholder="桌面端自动写入或手动粘贴">
      </div>
      <div class="field">
        <label for="port">端口</label>
        <input id="port" inputmode="numeric" value="18765" placeholder="18765">
      </div>
      <div class="actions">
        <button type="submit">保存并重连</button>
        <button type="button" id="repair">恢复自动对接</button>
      </div>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
