<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>xbs 页面桥</title>
  <style>
    body {
      font: 14px/1.45 system-ui, sans-serif;
      width: 340px;
      box-sizing: border-box;
      margin: 0;
      padding: 16px;
      color: #1c1b19;
      background: #fff;
    }
    h1 { font-size: 1.05rem; margin: 0 0 10px; }
    #status {
      white-space: pre-wrap;
      margin: 0;
      padding: 8px 10px;
      background: #f7f6f3;
      border: 1px solid #e4e0d8;
    }
    #status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: #666666;
      vertical-align: 1px;
    }
    #status[data-state="on"]::before { background: #1b7f3a; }
    #status[data-state="error"]::before { background: #8c2f2f; }
    #status:not([data-state])::before { display: none; }
    p { color: #5c574e; margin: 12px 0 0; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; font: inherit; }
    button { margin-top: 14px; padding: 8px 14px; font: inherit; }
  </style>
</head>
<body>
  <h1>xbs 页面桥</h1>
  <div id="status" role="status"></div>
  <form id="form">
    <label>令牌
      <input id="token" autocomplete="off" spellcheck="false">
    </label>
    <label>端口
      <input id="port" inputmode="numeric" value="18765">
    </label>
    <button type="submit">保存并重连</button>
  </form>
  <p>令牌和端口必须与桌面端或 <code>xbs-ext-smoke</code> 的桥一致。</p>
  <script src="options.js"></script>
</body>
</html>
