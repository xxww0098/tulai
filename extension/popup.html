<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>tulai 页面桥</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --sunken: #F1F5F9;
      --border: #E5E9F0;
      --border-strong: #CBD5E1;
      --text: #0F172A;
      --muted: #526075;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --on-accent: #FFFFFF;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --focus-ring: rgba(37, 99, 235, 0.24);
      --success: #15803D;
      --success-bg: rgba(21, 128, 61, 0.08);
      --success-border: rgba(21, 128, 61, 0.22);
      --warning: #B45309;
      --warning-bg: rgba(180, 83, 9, 0.08);
      --warning-border: rgba(180, 83, 9, 0.22);
      --danger: #DC2626;
      --danger-bg: rgba(220, 38, 38, 0.08);
      --danger-border: rgba(220, 38, 38, 0.22);
      --shadow: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090C12;
        --card: #131924;
        --sunken: #1A2230;
        --border: #232E40;
        --border-strong: #334155;
        --text: #F1F5F9;
        --muted: #94A3B8;
        --accent: #60A5FA;
        --accent-hover: #3B82F6;
        --on-accent: #090D16;
        --accent-soft: rgba(96, 165, 250, 0.14);
        --focus-ring: rgba(96, 165, 250, 0.28);
        --success: #34D399;
        --success-bg: rgba(52, 211, 153, 0.12);
        --success-border: rgba(52, 211, 153, 0.24);
        --warning: #FBBF24;
        --warning-bg: rgba(251, 191, 36, 0.12);
        --warning-border: rgba(251, 191, 36, 0.24);
        --danger: #F87171;
        --danger-bg: rgba(248, 113, 113, 0.12);
        --danger-border: rgba(248, 113, 113, 0.24);
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      width: 356px;
      margin: 0;
      padding: 14px;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .head-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .head-text { min-width: 0; }

    h1 {
      font-size: 16.5px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin: 0;
      color: var(--text);
    }

    .subtitle {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    #status {
      white-space: pre-wrap;
      margin: 0 0 12px;
      padding: 9px 11px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    #status:not([data-state]):empty {
      display: none;
    }

    #status[data-state="on"] {
      background: var(--success-bg);
      border-color: var(--success-border);
    }

    #status[data-state="error"] {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    #status[data-state="off"] {
      background: var(--warning-bg);
      border-color: var(--warning-border);
    }

    #status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--muted);
      vertical-align: 1px;
    }

    #status[data-state="on"]::before { background: var(--success); }
    #status[data-state="off"]::before { background: var(--warning); }
    #status[data-state="error"]::before { background: var(--danger); }
    #status:not([data-state])::before { display: none; }

    #form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--sunken);
      border: 1px solid var(--border);
      border-radius: 6px;
      caret-color: var(--accent);
      transition: border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
    }

    input:hover {
      border-color: var(--border-strong);
    }

    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 0;
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    #token,
    #port {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    button {
      flex: 1;
      height: 32px;
      padding: 0 12px;
      font: inherit;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, opacity 150ms ease;
    }

    button:hover {
      background: var(--sunken);
    }

    button[type="submit"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin: 10px 2px 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="head">
    <span class="head-icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="tl-bg" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0F1B38"/>
            <stop offset="55%" stop-color="#080E1E"/>
            <stop offset="100%" stop-color="#040812"/>
          </linearGradient>
          <linearGradient id="tl-back" x1="10" y1="4" x2="19" y2="14" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#1E3A8A"/>
          </linearGradient>
          <linearGradient id="tl-mid" x1="7" y1="6" x2="18" y2="17" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60A5FA"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
          </linearGradient>
          <linearGradient id="tl-front" x1="5" y1="9" x2="16" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E2EEFF"/>
          </linearGradient>
          <linearGradient id="tl-spark" x1="7" y1="11" x2="14" y2="18" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1E3A8A"/>
          </linearGradient>
          <linearGradient id="tl-orb" x1="12.5" y1="9.8" x2="15" y2="12.2" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34D399"/>
            <stop offset="100%" stop-color="#0EA5E9"/>
          </linearGradient>
        </defs>
        <rect x="0.75" y="0.75" width="22.5" height="22.5" rx="5.5" fill="url(#tl-bg)" stroke="#3B82F6" stroke-opacity="0.28" stroke-width="0.75"/>
        <rect x="9.6" y="4.2" width="9.8" height="9.8" rx="2.6" fill="url(#tl-back)"/>
        <rect x="7.4" y="6.2" width="10.4" height="10.4" rx="2.7" fill="url(#tl-mid)"/>
        <rect x="4.8" y="8.8" width="11.2" height="11.2" rx="2.8" fill="url(#tl-front)"/>
        <path d="M10.4 10.6Q11.24 13.56 14.2 14.4Q11.24 15.24 10.4 18.2Q9.56 15.24 6.6 14.4Q9.56 13.56 10.4 10.6Z" fill="url(#tl-spark)"/>
        <circle cx="13.8" cy="11.0" r="1.05" fill="url(#tl-orb)"/>
      </svg>
    </span>
    <div class="head-text">
      <h1>tulai 页面桥</h1>
      <p class="subtitle">桌面端与网页工作台实时通信配对</p>
    </div>
  </header>
  <div id="status" role="status" aria-live="polite"></div>
  <form id="form">
    <div class="field">
      <label for="token">令牌</label>
      <input id="token" autocomplete="off" spellcheck="false" placeholder="桌面端自动写入或手动粘贴">
    </div>
    <div class="field">
      <label for="port">端口</label>
      <input id="port" inputmode="numeric" value="18765" placeholder="18765">
    </div>
    <div class="actions">
      <button type="submit">保存并重连</button>
      <button type="button" id="repair">恢复自动对接</button>
    </div>
  </form>
  <p class="hint">tulai 打开后会自动写入令牌和端口。自动对接失败时，再把桌面端的令牌粘贴到这里。</p>
  <script src="options.js"></script>
</body>
</html>
