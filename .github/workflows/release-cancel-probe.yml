name: Release cancellation probe
on:
  push:
    branches: [codex/release-cancel-probe]
permissions:
  contents: read
jobs:
  windows-cancellation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and smoke-test Camoufox
        run: go run ./cmd/tulai-camoufox-smoke
      - name: Verify cancellation preserves the account environment
        run: go test -count=1 -timeout 5m -v -run '^TestCanceledEvaluationClosesOnlyItsPage$' ./internal/cdp
