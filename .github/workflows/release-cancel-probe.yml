name: Release browser probe
on:
  push:
    branches: [codex/release-cancel-probe]
permissions:
  contents: read
jobs:
  browser-probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and smoke-test Camoufox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/tulai-camoufox-smoke
      - name: Verify protected grid image
        env:
          TULAI_CAPTCHA_CAPTURE: ${{ runner.temp }}/captcha-probe
        run: go test -count=3 -timeout 8m -run '^TestCaptchaGridE2E$' ./internal/strategy
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captcha-probe
          path: ${{ runner.temp }}/captcha-probe
          if-no-files-found: ignore
