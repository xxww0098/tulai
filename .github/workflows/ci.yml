name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        if: github.ref_type == 'tag'
      - name: Tag matches the tested main commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-ci.sh

  test:
    if: github.ref_type != 'tag'
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Test
        run: go test ./... -short -race -timeout 20m
      - name: Vet and build all commands
        run: go vet ./... && go build ./cmd/...
      - name: Verify MyGo bindings and frontend
        run: |
          go tool mygo generate
          git diff --exit-code frontend/src/mygo.ts
          bun install --frozen-lockfile --cwd frontend
          bun run --cwd frontend typecheck
          bun run --cwd frontend test
          bun run --cwd frontend build
      - name: Install fingerprint test dependencies
        run: npm ci --prefix internal/fingerprint/driver --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fingerprint policy tests
        run: node --test internal/fingerprint/driver/*.test.mjs
      - name: Extension tests
        run: |
          for f in $(find extension -name '*_test.js' | LC_ALL=C sort); do
            echo "Running $f"
            node "$f"
          done
      - name: Test scripts
        run: |
          bash scripts/check-release-ci.test.sh
          python3 -m unittest discover -s scripts -p '*_test.py'

  windows-test:
    if: github.ref_type != 'tag'
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows browser, runtime, downloads, and updater
        run: go test ./internal/browser ./internal/fingerprint ./internal/download ./internal/update ./cmd/tulai -short
      - name: Build all commands on Windows
        run: go build ./cmd/...
      - name: Vet
        run: go vet ./...

  fingerprint:
    if: github.ref_type != 'tag'
    needs: guard
    name: fingerprint (${{ matrix.os }}, ${{ matrix.suite.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
        suite:
          - name: browser
            packages: ./internal/browser ./internal/cdp ./internal/captcha
          - name: strategy
            packages: ./internal/strategy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The smoke install downloads Node, playwright-core and the pinned
      # fingerprint-chromium archive into the user config dir; cache it keyed
      # on the pinned versions and lockfile so runs skip the downloads.
      - name: Cache Fingerprint runtime
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Roaming/tulai/runtime/fingerprint
            ~/Library/Application Support/tulai/runtime/fingerprint
          key: fingerprint-runtime-${{ matrix.os }}-${{ hashFiles('go.mod', 'internal/fingerprint/install.go', 'internal/fingerprint/fingerprint.go', 'internal/fingerprint/driver/package-lock.json') }}
          restore-keys: fingerprint-runtime-${{ matrix.os }}-
      - name: Install and smoke-test Fingerprint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/tulai-fingerprint-smoke
      - name: Account isolation, persistence and page operations
        run: go test -count=1 -timeout 30m -p 1 ${{ matrix.suite.packages }}

  fingerprint-bundle:
    needs: guard
    name: prepare Windows Fingerprint runtime
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare pinned Node and launcher dependencies
        run: go run ./cmd/tulai-fingerprint-bundle
      - name: Verify bundled runtime on Windows
        run: go test -tags=tulai_fingerprint_bundle -run '^TestEmbeddedWindowsRuntimeLoadsWithoutNetwork$' -count=1 ./internal/fingerprint
      - uses: actions/upload-artifact@v7
        with:
          name: fingerprint-runtime-windows-amd64
          if-no-files-found: error
          retention-days: 1
          path: internal/fingerprint/bundled/windows-amd64.zip

  package:
    needs: [guard, fingerprint-bundle]
    name: package windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --cwd frontend
      - uses: actions/download-artifact@v7
        with:
          name: fingerprint-runtime-windows-amd64
          path: internal/fingerprint/bundled
      - name: Verify Windows runtime bundle before packaging
        env:
          TULAI_REQUIRE_WINDOWS_BUNDLE: "1"
        run: go test -run '^TestBundledWindowsArchiveUnpacks$' -count=1 ./internal/fingerprint
      - name: Package
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-tags=tulai_fingerprint_bundle"
        run: go tool mygo build -platform windows/amd64,windows/arm64
      - name: Collect distributable files
        run: scripts/collect-dist.sh windows
      - uses: actions/upload-artifact@v7
        with:
          name: tulai-windows
          if-no-files-found: error
          retention-days: 14
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: tulai-*
          path: artifacts
      - name: Stage release assets
        run: |
          mkdir -p release
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            if [[ "$base" == "SHA256SUMS.txt" ]]; then
              continue
            fi
            dest="release/$base"
            if [[ -e "$dest" ]]; then
              if ! cmp -s "$file" "$dest"; then
                echo "asset name collision: $base" >&2
                exit 1
              fi
              continue
            fi
            cp "$file" "$dest"
          done < <(find artifacts -type f -print0)
          (
            cd release
            files=()
            while IFS= read -r line; do
              files+=("$line")
            done < <(find . -maxdepth 1 -type f -print | sed 's|^\./||' | LC_ALL=C sort)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "no release assets" >&2
              exit 1
            fi
            # SHA256SUMS is required. The desktop updater refuses a release without it.
            # Names match internal/update.AssetName. Spaces stay here; GitHub
            # stores those uploads with dots, and the updater normalizes both.
            sha256sum "${files[@]}" > SHA256SUMS
            test -s SHA256SUMS
            version=${GITHUB_REF_NAME#v}
            required=(
              "tulai Setup ${version} amd64.exe"
              "tulai Setup ${version} arm64.exe"
              "tulai-${version}-windows-amd64.exe"
              "tulai-${version}-windows-arm64.exe"
            )
            for name in "${required[@]}"; do
              if [[ ! -f "$name" ]]; then
                echo "updater asset missing: $name" >&2
                exit 1
              fi
            done
          )
          find release -type f -print | LC_ALL=C sort
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          changes=$(awk -v heading="## $version" '/^## / { if (found) exit; found = ($0 == heading); next } found { print }' CHANGELOG.md)
          if [[ -z "${changes//[[:space:]]/}" ]]; then
            echo "missing release notes for $version in CHANGELOG.md" >&2
            exit 1
          fi
          notes=$(mktemp)
          {
            echo "# tulai ${version}"
            echo
            echo "桌面端 ${version}（mygo.json，标签 ${GITHUB_REF_NAME}）。"
            printf '%s\n' "$changes"
            echo
            echo "- 本版本只提供 Windows 安装包；macOS 和 Linux 可继续使用历史版本。"
            echo "- Windows 安装器和 exe 没有代码签名，SmartScreen 可能报警。"
            echo "- 手动检查更新可打开「设置 → 关于与更新」，或运行 \`tulai update\`。有任务在运行时，桌面端会等任务结束后再安装。"
            echo
            echo "说明见 docs/RELEASING.md。"
          } >"$notes"
          args=(--title "tulai ${version}" --notes-file "$notes")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release -maxdepth 1 -type f -print0)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag "${args[@]}"
          fi
