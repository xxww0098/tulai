name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the tested main commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-ci.sh

  test:
    if: github.ref_type != 'tag'
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0 libcairo2
      - name: Test
        run: go test ./... -short -race
      - name: Vet
        run: go tool mygo vet
      - name: Install fingerprint test dependencies
        run: npm ci --prefix internal/camoufox/driver --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fingerprint policy tests
        run: node --test internal/camoufox/driver/*.test.mjs
      - name: Extension tests
        run: |
          node extension/content_test.js
          node extension/download_test.js
          node extension/network_test.js
          node extension/qianwen/page_test.js
          node extension/doubao/page_test.js
          node extension/bridge_test.js
          node extension/pair_test.js
          node extension/quota_test.js
          node extension/refuse_test.js
      - name: Test release gate
        run: bash scripts/check-release-ci.test.sh

  extension:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pack the page-bridge extension
        run: |
          ver=$(jq -r .version extension/manifest.json)
          rm -rf dist-extension
          mkdir -p dist-extension/tulai-extension
          cp -a extension/. dist-extension/tulai-extension/
          find dist-extension/tulai-extension -name '*.go' -delete
          find dist-extension -name .DS_Store -delete
          (cd dist-extension && zip -r "tulai-extension-${ver}.zip" tulai-extension)
          (cd dist-extension && sha256sum "tulai-extension-${ver}.zip" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: tulai-extension
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-extension/*.zip
            dist-extension/SHA256SUMS.txt

  camoufox:
    if: github.ref_type != 'tag'
    needs: guard
    name: camoufox (${{ matrix.os }}, ${{ matrix.suite.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest","macos-latest","macos-15-intel"]' || '["windows-latest"]') }}
        suite:
          - name: browser
            packages: ./internal/browser ./internal/cdp ./internal/captcha
          - name: strategy
            packages: ./internal/strategy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and smoke-test Camoufox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/tulai-camoufox-smoke
      - name: Account isolation, persistence and page operations
        run: go test -count=1 -timeout 30m -p 1 ${{ matrix.suite.packages }}

  package:
    needs: guard
    name: package windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Package
        env:
          CGO_ENABLED: "0"
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo "MYGO_UPDATER_PRIVATE_KEY is required for a release" >&2
            exit 1
          fi
          go tool mygo build -platform windows/amd64,windows/arm64
      - name: Collect distributable files
        env:
          REQUIRE_SIGNED_UPDATES: ${{ github.ref_type == 'tag' && '1' || '0' }}
        run: scripts/collect-dist.sh windows
      - uses: actions/upload-artifact@v7
        with:
          name: tulai-windows
          if-no-files-found: error
          retention-days: 14
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [extension, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: tulai-*
          path: artifacts
      - name: Stage release assets
        run: |
          mkdir -p release
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            if [[ "$base" == "SHA256SUMS.txt" ]]; then
              continue
            fi
            dest="release/$base"
            if [[ -e "$dest" ]]; then
              if ! cmp -s "$file" "$dest"; then
                echo "asset name collision: $base" >&2
                exit 1
              fi
              continue
            fi
            cp "$file" "$dest"
          done < <(find artifacts -type f -print0)
          (
            cd release
            files=()
            while IFS= read -r line; do
              files+=("$line")
            done < <(find . -maxdepth 1 -type f -print | sed 's|^\./||' | LC_ALL=C sort)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "no release assets" >&2
              exit 1
            fi
            # SHA256SUMS is required. The desktop updater refuses a release without it.
            # Names match internal/update.AssetName. Spaces stay here; GitHub
            # stores those uploads with dots, and the updater normalizes both.
            sha256sum "${files[@]}" > SHA256SUMS
            test -s SHA256SUMS
            version=${GITHUB_REF_NAME#v}
            required=(
              "tulai Setup ${version} amd64.exe"
              "tulai Setup ${version} arm64.exe"
              "tulai-${version}-windows-amd64.exe"
              "tulai-${version}-windows-arm64.exe"
              "tulai-${version}-windows-amd64.tar.gz"
              "tulai-${version}-windows-arm64.tar.gz"
              "update-windows-amd64.json"
              "update-windows-arm64.json"
            )
            shopt -s nullglob
            extzips=(tulai-extension-*.zip)
            if [[ ${#extzips[@]} -ne 1 ]]; then
              echo "expected one tulai-extension zip, found ${#extzips[@]}" >&2
              exit 1
            fi
            for name in "${required[@]}"; do
              if [[ ! -f "$name" ]]; then
                echo "updater asset missing: $name" >&2
                exit 1
              fi
            done
          )
          find release -type f -print | LC_ALL=C sort
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          ext=$(unzip -p release/tulai-extension-*.zip tulai-extension/manifest.json | jq -r .version)
          notes=$(mktemp)
          {
            echo "# tulai ${version}"
            echo
            echo "桌面端 ${version}（mygo.json，标签 ${GITHUB_REF_NAME}）。页面桥扩展是 ${ext}（tulai-extension-${ext}.zip），编号独立，不跟着桌面端走。"
            echo
            jq -er '.notes | select(length > 0)' release/update-windows-amd64.json
            echo
            echo "- 本版本只提供 Windows 安装包；macOS 和 Linux 可继续使用历史版本。"
            echo "- Windows 安装器和 exe 没有代码签名，SmartScreen 可能报警。"
            echo "- 桌面端启动后自动检查（设置里可关闭），也可用「帮助 → 检查更新…」或 \`tulai update\`。Windows 安装版使用 MyGo 验证更新签名，便携版及旧版使用 SHA256SUMS。任务结束后才安装。页面桥扩展单独更新。"
            echo
            echo "说明见 docs/RELEASING.md。"
          } >"$notes"
          args=(--title "tulai ${version}" --notes-file "$notes")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release -maxdepth 1 -type f ! -name 'update-*.json' -print0)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release -maxdepth 1 -type f -name 'update-*.json' -print0)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag "${args[@]}"
          fi
