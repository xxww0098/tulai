name: tulai
id: dev.tulai.app
version: 0.1.38
copyright: Copyright (c) 2026 xxww0098
icon:
  png: assets/Icon.png
theme: theme.yaml
dev:
  target: native
build:
  output: ../../build
  targets: [windows_x64, windows_arm64]
  installers: true
# nsgo 0.3.0 fails a build on a dependency license it cannot classify. These two
# are BSD-3-Clause; their folders hold texts under LICENSE names that are not
# licenses: memory's LICENSE-LOGO is a link to a logo, and sqlite's
# LICENSE-SQLITE is SQLite's public-domain dedication. Its third-party notice
# also names an MPL-2.0 module, hashicorp/golang-lru, that no build of tulai links.
licenses:
  allow: [modernc.org/memory, modernc.org/sqlite]
release:
  github: xxww0098/tulai
windows:
  publisher: xxww0098
linux:
  summary: 批量生图（豆包 / 千问 / ChatGPT / Antigravity）
  categories: [Graphics, Utility]
